# Render Blueprint — one-click deploy.
# Render dashboard → New → Blueprint → pick this repo → Apply.
# Nothing to fill in: the secret key is generated and DATABASE_URL is wired automatically.

databases:
  - name: routepulse-db
    plan: free
    region: singapore
    databaseName: logistics
    user: logistics

services:
  - type: web
    name: routepulse
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: routepulse-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      # Django is only reached through the internal proxy, never directly from the internet.
      - key: ALLOWED_HOSTS
        value: 127.0.0.1,localhost
      - key: CORS_ALLOWED_ORIGINS
        value: http://127.0.0.1:10000
      - key: MOCK_CARRIER_URL
        value: file:///srv/mock-carrier/index.html
      - key: CHROME_BINARY
        value: /usr/bin/chromium
      - key: CHROMEDRIVER_PATH
        value: /usr/bin/chromedriver
      - key: BACKEND_INTERNAL_URL
        value: http://127.0.0.1:8000
